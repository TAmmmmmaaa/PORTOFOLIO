<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050203" />
    <script>
      // Pasang tema sebelum halaman tampil supaya tidak berkedip. Urutan: pilihan tersimpan > pengaturan perangkat.
      ;(function () {
        var t = 'dark'
        try {
          var s = localStorage.getItem('tama-theme')
          if (s === 'light' || s === 'dark') t = s
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#ffb9a6' : '#050203')
      })()
    </script>
    <meta name="description" content="Portofolio Tama Rachidi, Junior Developer dan mahasiswa Teknik Informatika." />
